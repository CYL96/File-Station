name: file-station

services:
  file-station:
    build: .
    image: file-station:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PUID: "${PUID-1000}"
      PGID: "${PGID-1000}"
      UMASK: "${UMASK-0022}"
      PASSWORD: "${PASSWORD-}"
      ConfigPath: "${ConfigPath-}"
    volumes:
      - ./state:/var/lib/file-station
      # Optional: expose an existing host directory, then add /mnt/documents in the UI.
      # - /srv/documents:/mnt/documents
      # Use :ro for an OS-level read-only mount.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
