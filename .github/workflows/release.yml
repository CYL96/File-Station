name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require a commit merged into the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo '::error::发布标签必须指向已合入默认分支的提交。'
            exit 1
          fi

      - name: Set up Node.js
        # actions/setup-node v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Validate release version
        id: version
        shell: bash
        run: |
          tag=$(bash scripts/release-version.sh "$GITHUB_REF_NAME")
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        # actions/setup-node v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Build web assets
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Test Go packages
        run: go test ./...

      - name: Package release
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/package-release.sh "$TAG" "$ARCH" "$RUNNER_TEMP/release"

      - name: Smoke test release package
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          smoke_dir=$(mktemp -d "$RUNNER_TEMP/release-smoke.XXXXXX")
          trap 'rm -rf -- "$smoke_dir"' EXIT
          package="file-station-$TAG-linux-$ARCH"
          tar -xzf "$RUNNER_TEMP/release/$package.tar.gz" -C "$smoke_dir"
          "$smoke_dir/$package/file-station" -h
          test -f "$smoke_dir/$package/web/dist/index.html"

      - name: Upload release package
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download release packages
        # actions/download-artifact v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      - name: Publish GitHub Release
        shell: bash
        working-directory: ${{ runner.temp }}/release
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          amd64="file-station-$TAG-linux-amd64.tar.gz"
          arm64="file-station-$TAG-linux-arm64.tar.gz"
          for package in "$amd64" "$arm64"; do
            if [[ ! -f "$package" ]]; then
              printf '::error::缺少发布文件：%s\n' "$package" >&2
              exit 1
            fi
          done
          sha256sum "$amd64" "$arm64" > SHA256SUMS
          gh release create "$TAG" "$amd64" "$arm64" SHA256SUMS \
            --verify-tag --title "File Station $TAG" --generate-notes

  cache:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/nix-cache.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
