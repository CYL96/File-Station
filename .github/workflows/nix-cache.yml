name: Nix binary cache

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - Dockerfile
      - docker-entrypoint.sh
      - compose.yaml
      - .dockerignore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check Cachix configuration
        shell: bash
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_CACHE" ]]; then
            echo '::error::请设置 repository variable CACHIX_CACHE。'
            exit 1
          fi
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo '::error::请设置 repository secret CACHIX_AUTH_TOKEN。'
            exit 1
          fi

      - name: Check out source
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Nix
        # cachix/install-nix-action v31
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702

      - name: Set up Cachix
        # cachix/cachix-action v17
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
          pathsToPush: result

      - name: Build File Station
        run: nix build --print-build-logs .#packages.${{ matrix.system }}.default

      - name: Check packaged wrapper
        run: ./result/bin/file-station -h
